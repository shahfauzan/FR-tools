name: FR-tools Android APK Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle Project
        id: find-gradle
        shell: bash
        run: |
          GRADLE_FILE=$(find . -type f -name gradlew \
            -not -path './.git/*' | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No Gradle wrapper (gradlew) found."
            echo "This repository needs an Android Gradle project."
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$GRADLE_FILE"

          echo "Gradle project found: $GRADLE_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ steps.find-gradle.outputs.gradle_dir }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FR-tools-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn
          retention-days: 14
